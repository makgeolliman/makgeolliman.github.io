<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 개인 홈페이지</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem 0;
        }
        main {
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 2rem;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 0.5rem 0;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>안녕하세요! 홍길동의 공간입니다</h1>
        <p>GitHub Pages로 만든 첫 번째 웹사이트</p>
    </header>

    <main>
        <h2>소개</h2>
        <p>웹 개발과 새로운 기술에 관심이 많은 개발자 지망생입니다.</p>

        <h2>링크</h2>
        <ul>
            <li>📧 이메일: example@email.com</li>
            <li>💻 블로그: <a href="#" target="_blank">내 블로그 가기</a></li>
        </ul>
    </main>

</body>
</html>
