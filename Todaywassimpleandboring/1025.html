        body {

            background: linear-gradient(to bottom, #000333 50%, #f1c40f 50%);    /* 위에서 아래방향(to bottom)으로 50% 지점까지 진파랑, 50% 지점부터 노랑 */

<body>
  <div id="content">

  </div>

  <script>
    // 페이지가 로드될 때 실행
    window.addEventListener('DOMContentLoaded', () => {
        // 1. 현재 전체 URL 가져오기
        const currentUrl = window.location.href;
        //document.getElementById('current-url').textContent = currentUrl;
        //<p>현재 URL: <strong id="current-url"></strong></p>

        // 2. 마지막 슬래시(/)의 위치 찾기 및 그 다음 문자열 잘라내기
        const lastSlashIndex = currentUrl.lastIndexOf('/');

        if (lastSlashIndex !== -1 && lastSlashIndex < currentUrl.length - 1)
        {
            const targetString = currentUrl.substring(lastSlashIndex + 1);

            // 3. 첫 두 글자 추출 (인덱스 0부터 2 전까지)
            const firstTwo = targetString.substring(0, 2);

            // 4. 다음 두 글자 추출 (인덱스 2부터 4 전까지)
            const nextTwo = targetString.substring(2, 4);

            // 5. 화면에 출력 (값이 있을 때만 출력)
            //document.getElementById('first-two').textContent = firstTwo || '(글자 부족)';
            //document.getElementById('next-two').textContent = nextTwo || '(글자 부족)';


            //<p>첫 번째 두 글자: <strong id="first-two" style="color: blue;"></strong></p>
            //<p> 두 글자: <strong id="kbk1" style="color: green;"></strong></p>
            //<p>두 번째 두 글자: <strong id="next-two" style="color: green;"></strong></p>
            //<p> 두 글자: <strong id="kbk2" style="color: green;"></strong></p>

            // 1. 오늘 날짜 구하기
            const today = new Date();
            const currentMonth = today.getMonth() + 1; // 0~11 -> 1~12월로 변환
            const currentDay = today.getDate();       // 오늘 일자 (1~31)

            // 월, 일을 2자리 문자열로 변환 (예: 1 -> '01')
            const monthStr = String(currentMonth).padStart(2, '0');
            const dayStr = String(currentDay).padStart(2, '0');

            //document.getElementById('kbk1').textContent = monthStr;
            //document.getElementById('kbk2').textContent = dayStr;

            if (String(firstTwo).trim() === String(monthStr).trim())
            {
                if(String(nextTwo).trim() === String(dayStr).trim())
                {
                    document.getElementById('content').style.display = 'block';
                }
            }
            else
            {
                document.getElementById('content').style.display = 'none';
            }
        }
        else
        {
            //document.getElementById('first-two').textContent = '슬래시 뒤에 문자가 없습니다.';
        }
    });

  </script>

  <h6 id="visit-message"></h6>
  <script>
      // localStorage에서 'visitCount' 값을 가져옵니다.
      let visitCount = localStorage.getItem('visitCount');

      if (visitCount === null) {
          // 처음 방문한 경우 1로 초기화합니다.
          visitCount = 1;
      } else {
          // 이미 방문한 적이 있다면 기존 값에 1을 더합니다.
          visitCount = Number(visitCount) + 1;
      }

      // 증가한 값을 다시 localStorage에 저장합니다.
      localStorage.setItem('visitCount', visitCount);

      // 화면에 방문 횟수를 출력합니다.
      document.getElementById('visit-message').innerText = `${visitCount}`;
  </script>

</body>
</html>
