
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전체 화면 페이지</title>
    <style>
        /* 화면의 스크롤바를 완전히 제거하고 여백을 없앱니다 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <h1>모든 바가 없는 전체 화면 페이지</h1>
        <p>브라우저 보안으로 인해 처음 열릴 때는 버튼 클릭이나 사용자 반응이 필요합니다.</p>
        <button onclick="openFullscreen();" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
            전체 화면으로 보기
        </button>
    </div>

    <script>
        // 전체 화면을 요청하는 함수
        function openFullscreen() {
            var elem = document.documentElement; // 페이지 전체 선택
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // 사용자가 페이지를 클릭하기만 해도 자동으로 전체 화면이 되도록 하려면 아래 주석을 해제하세요.
         document.addEventListener("click", openFullscreen);
    </script>

</body>
</html>
