
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>rite jesa</title>
    <style>
        /* 화면의 스크롤바를 완전히 제거하고 여백을 없앱니다 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .bg-container {
          width: 100vw;  /* 화면 너비의 100% */
          height: 100vh; /* 화면 높이의 100% */
          overflow: hidden;
        }
        .bg-container img {
          width: 95%;
          height: 85%;
          object-fit: cover; /* 이미지가 찌그러지지 않게 비율을 유지하며 꽉 채움 */
    </style>
</head>
<body>

    <div style="text-align: center;">
        <!-- 이미지를 출력하는 기본 코드 -->
        <div class="bg-container">
            <center><img src="ritejesa.png" alt="rite jesa"></center>
            <button onclick="openFullscreen();" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
                전체 화면으로 보기
            </button>
        </div>
    </div>

    <script>
        // 전체 화면을 요청하는 함수
        function openFullscreen() {
            var elem = document.documentElement; // 페이지 전체 선택
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // 사용자가 페이지를 클릭하기만 해도 자동으로 전체 화면이 되도록 하려면 아래 주석을 해제하세요.
        // document.addEventListener("click", openFullscreen);
    </script>

</body>
</html>
