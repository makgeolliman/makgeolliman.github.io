
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ritejesa</title>
    <style>
        body {
            background-color: #582a06;
        }
        .bg-container {
          width: 100vw;  /* 화면 너비의 100% */
          height: 100vh; /* 화면 높이의 100% */
          overflow: hidden;
        }
        .bg-container img {
          width: 100%;
          height: 100%;
          object-fit: cover; /* 이미지가 찌그러지지 않게 비율을 유지하며 꽉 채움 */
        }
    </style>
</head>
<body>
    <!-- 이미지를 출력하는 기본 코드 -->
    <div class="bg-container">
        <center></center><img src="ritejesa.png" alt="rite jesa"></center>
    </div>
</body>
</html>
