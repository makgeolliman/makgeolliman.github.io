<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>rite jesa</title>
    <style>
        /* 화면의 스크롤바를 완전히 제거하고 여백을 없앱니다 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .bg-container {
            width: 100vw;  /* 화면 너비의 100% */
            height: 100vh; /* 화면 높이의 100% */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .bg-container img {
            width: 80%;
            height: 80%;
            object-fit: cover; /* 이미지가 찌그러지지 않게 비율을 유지하며 채움 */
            transition: width 0.3s, height 0.3s; /* 크기 변경 시 부드러운 효과 */
        }

        /* [요구사항 2] 전체 화면일 때 이미지 크기를 100%로 변경 */
        :fullscreen .bg-container img,
        :-webkit-full-screen .bg-container img,
        :-ms-fullscreen .bg-container img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div style="text-align: center;">
        <div class="bg-container">
            <img src="ritejesa.png" alt="rite jesa">
            <!-- [요구사항 1] ID 추가 (JS 제어용) -->
            <button id="fullscreen-btn" onclick="openFullscreen();" style="padding: 10px 20px; font-size: 16px; cursor: pointer; margin-top: 20px;">
                Full Screen View
            </button>
        </div>
    </div>

    <script>
        // 전체 화면을 요청하는 함수
        function openFullscreen() {
            var elem = document.documentElement; // 페이지 전체 선택
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // 전체 화면에서 아무 데나 클릭했을 때 일반 화면으로 돌아가는 이벤트 리스너
        document.addEventListener('click', function() {
            // 현재 문서가 전체 화면 상태인지 확인
            const isFullscreen = document.fullscreenElement || 
                                 document.webkitFullscreenElement || 
                                 document.msFullscreenElement;

            // 전체 화면 상태일 때만 실행
            if (isFullscreen) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* 사파리(Safari) 지원 */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 지원 */
                    document.msExitFullscreen();
                }
            }
        });

        // [요구사항 1] 전체 화면 상태 변화 감지 및 버튼 숨김/보임 처리
        function handleFullscreenChange() {
            var btn = document.getElementById("fullscreen-btn");
            // 현재 전체화면인 요소가 있는지 확인
            var isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            
            if (isFullscreen) {
                btn.style.display = "none";  /* 전체 화면일 때 숨김 */
            } else {
                btn.style.display = "block"; /* 일반 화면일 때 보임 */
            }
        }

        // 브라우저별 전체화면 이벤트 리스너 등록
        document.addEventListener("fullscreenchange", handleFullscreenChange);
        document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
        document.addEventListener("msfullscreenchange", handleFullscreenChange);
    </script>

</body>
</html>
