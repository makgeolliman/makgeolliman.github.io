<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiteJesa</title>
    <style>
        /* 화면 전체를 채우고 스크롤을 방지 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D 공간을 위한 원근감(Perspective) 컨테이너 */
        #viewport {
            width: 100vw;
            height: 100vh;
            perspective: 2000px; /* 3D 깊이감 설정 */
            perspective-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D 방의 메인 컨테이너 (회전 없음, 자바스크립트로 Z축 이동만 제어) */
        #room {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* 모든 벽면의 공통 스타일 */
        .wall {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-weight: bold;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid #404040;   // 테두리 선을 보여줌
            //border: none;
            backface-visibility: hidden;
        }

        /* 정면 벽 (기준면: 화면 가득 채움) */
        .front {
            width: 100vw;
            height: 100vh;
            background-color: #34495e;
            background-image: url('ritejesa.png');
            background-repeat: no-repeat;      /* 💡 이미지가 여러 개 반복되지 않도록 설정 */
 
            background-size: 100% 100%;        /* 비율과 관계없이 무조건 꽉 채우기 */

            background-position: center;       /* 이미지를 정중앙에 정렬하여 위아래가 균등하게 맞춤 */
            /* 좌, 우, 바닥 벽의 깊이(30vw)만큼 뒤로 밀어 배치 */
            transform: translateZ(-30vw);
                                              // vw는 Viewport Width(뷰포트 너비)의 약자로, 현재 웹 브라우저 창 너비를 기준으로 하는 반응형 크기 단위입니다.

                                               // • 1vw = 브라우저 창 너비의 1%
• 100vw = 브라우저 창 전체 너비 (100%)
        }

        /* 좌측 벽 (폭은 정면 폭의 30% = 30vw) */
        .left {
            width: 30vw;
            height: 100vh;
            background-color: #1a1a1a;
            left: 0;
            /* 좌측 모서리를 기준으로 90도 회전 */
            transform-origin: left center;
            transform: rotateY(90deg);
        }

        /* 우측 벽 (폭은 정면 폭의 30% = 30vw) */
        .right {
            width: 30vw;
            height: 100vh;
            background-color: #1a1a1a;
            right: 0;
            /* 우측 모서리를 기준으로 -90도 회전 */
            transform-origin: right center;
            transform: rotateY(-90deg);
        }

        .top {
            width: 100vw;
            height: 30vw;
            background-color: #1a1a1a;
            top: 0;
            transform-origin: center top;
            transform: rotateX(-90deg);
        }

        /* 바닥 면 (세로 폭은 정면 폭의 30% = 30vw) */
        .bottom {
            width: 100vw;
            height: 30vw;
            background-color: #1a1a1a;
            bottom: 0;
            /* 아래쪽 모서리를 기준으로 90도 회전 */
            transform-origin: center bottom;
            transform: rotateX(90deg);
        }

        /* 천정(Top)은 요청에 따라 제외되었습니다. */
    </style>
</head>
<body>

    <div id="viewport">
        <div id="room">
            <div class="wall front"></div>
            <div class="wall left"></div>
            <div class="wall right"></div>
            <div class="wall top"></div>
            <div class="wall bottom"></div>
        </div>
    </div>

    <script>
        const room = document.getElementById('room');
        
        // 줌 제어 변수
        let currentZ = 0;       // 현재 카메라(방)의 Z축 위치
        const scrollSpeed = 0.5; // 스크롤 감도

        /* 
           [줌 제한 범위 설정 계산]
           - 최대 줌아웃 (minZ): 0 (방 초입, 좌우 벽면이 화면 시작점에 걸치는 지점)
           - 최대 줌인 (maxZ): 정면 벽의 깊이인 30vw 만큼만 들어갈 수 있게 제한하여 
                              정면 벽을 뚫고 지나가거나 방을 벗어나지 않도록 방지합니다.
        */
        function getLimits() {
            // 정면 폭의 30%에 해당하는 픽셀 값 계산
            const maxWallDepth = window.innerWidth * 0.3; 
            return {
                minZ: 0,
                maxZ: maxWallDepth - 50 // 정면 벽에 부딪히기 직전(50px 여유)까지만 줌인 허용
            };
        }

        // 마우스 휠 이벤트 리스너
        window.addEventListener('wheel', (e) => {
            // 스크롤 방향에 따라 Z축 이동 거리 계산 (위로 스크롤 시 줌인, 아래로 줌아웃)
            currentZ -= e.deltaY * scrollSpeed;

            // 실시간 브라우저 창 크기 기준 제한값 가져오기
            const limits = getLimits();

            // 범위 제한 (방 밖으로 벗어나지 않도록 고정)
            if (currentZ < limits.minZ) currentZ = limits.minZ;
            if (currentZ > limits.maxZ) currentZ = limits.maxZ;

            // 3D 변형 적용 (로테이션 없이 Z축 이동으로만 줌인/아웃 구현)
            room.style.transform = `translateZ(${currentZ}px)`;
        }, { passive: true });

        // 브라우저 리사이즈 시 화면이 깨지지 않도록 처리
        window.addEventListener('resize', () => {
            const limits = getLimits();
            if (currentZ > limits.maxZ) {
                currentZ = limits.maxZ;
                room.style.transform = `translateZ(${currentZ}px)`;
            }
        });




    </script>
</body>
    
</html>
