<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고수준 AI 장기 (초나라 vs 한나라)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #1e1e1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    overflow-x: auto;
  }
  /* 가로 1280px 고정, 세로 비율 자동 맞춤 */
  #game-wrapper {
    width: 1280px;
    height: 820px;
    background: #2c241b;
    border: 4px solid #5c4328;
    border-radius: 12px;
    display: flex;
    padding: 20px;
    gap: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
  }
  /* 왼쪽 장기판 영역 */
  #board-container {
    width: 720px;
    height: 780px;
    background: #deb887;
    border-radius: 8px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  canvas {
    display: block;
    cursor: pointer;
  }
  /* 오른쪽 정보 및 컨트롤 패널 */
  #side-panel {
    flex: 1;
    background: #382e24;
    border-radius: 8px;
    padding: 25px;
    color: #f4ebd9;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 2px solid #5c4328;
  }
  .title-box {
    text-align: center;
    border-bottom: 2px solid #5c4328;
    padding-bottom: 15px;
  }
  .title-box h1 { font-size: 32px; color: #f0c05a; letter-spacing: 4px; }
  .title-box p { font-size: 14px; color: #bba88e; margin-top: 5px; }
  
  .status-box {
    background: #261f18;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #4a3825;
  }
  .turn-indicator {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 15px;
  }
  .turn-cho { background: #164a28; color: #6ee798; border: 1px solid #2ea055; }
  .turn-han { background: #5c1919; color: #ff8a8a; border: 1px solid #b83232; }
  
  .score-board {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #4a3825;
  }
  #message-log {
    height: 240px;
    background: #1c1611;
    border: 1px solid #4a3825;
    border-radius: 6px;
    padding: 12px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
    color: #d6c7b2;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  select, button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }
  select {
    background: #4a3825;
    color: #f4ebd9;
    border: 1px solid #75593c;
  }
  button {
    background: #c88a36;
    color: #1e160d;
    transition: 0.2s;
  }
  button:hover { background: #e09f45; }
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="board-container">
    <canvas id="janggiCanvas" width="700" height="770"></canvas>
  </div>
  
  <div id="side-panel">
    <div class="title-box">
      <h1>楚 漢 長 棋</h1>
      <p>가로 1280px 최적화 | 고급 알파-베타 AI 탑재</p>
    </div>

    <div class="status-box">
      <div id="turnDisplay" class="turn-indicator turn-cho">초나라(플레이어) 차례</div>
      <div id="alertDisplay" style="text-align:center; color:#ffd700; font-weight:bold; height:24px;"></div>
      <div class="score-board">
        <span style="color:#6ee798;">초(나): <b id="choScore">72</b>점</span>
        <span style="color:#ff8a8a;">한(PC): <b id="hanScore">73.5</b>점</span>
      </div>
    </div>

    <div id="message-log">
      <div>[시스템] 대국이 시작되었습니다.</div>
      <div>[안내] 초나라(녹색)가 먼저 둡니다.</div>
    </div>

    <div class="controls">
      <select id="formationSelect">
        <option value="MSMS">초 포진: 마상마상 (기본)</option>
        <option value="SMSM">초 포진: 상마상마</option>
        <option value="MSSM">초 포진: 마상상마 (귀마)</option>
        <option value="SMMS">초 포진: 상마마상 (원앙마)</option>
      </select>
      <button id="restartBtn" onclick="initGame()">새 대국 시작 (초기화)</button>
      <button id="passBtn" onclick="passTurn()">한수 쉼 (통과)</button>
    </div>
  </div>
</div>

<script>

const canvas = document.getElementById('janggiCanvas');
const ctx = canvas.getContext('2d');

const COLS = 9;
const ROWS = 10;
const CELL = 72;
const OFFSET_X = 62;
const OFFSET_Y = 61;

// 기물 정의 (대문자: 한나라 PC, 소문자: 초나라 플레이어)
// K/k: 궁, C/c: 차, P/p: 포, H/h: 마, E/e: 상, A/a: 사, S/s: 졸/병
const PIECE_NAMES = {
  'K': '漢', 'C': '車', 'P': '包', 'H': '馬', 'E': '象', 'A': '士', 'S': '兵',
  'k': '楚', 'c': '車', 'p': '包', 'h': '馬', 'e': '象', 'a': '士', 's': '卒'
};

// AI 기물 가치 평가표 (장기 표준 점수 기반 가중치)
const PIECE_VALUES = {
  'K': 100000, 'C': 1300, 'P': 700, 'H': 500, 'E': 300, 'A': 300, 'S': 200,
  'k': -100000, 'c': -1300, 'p': -700, 'h': -500, 'e': -300, 'a': -300, 's': -200
};

let board = [];
let turn = 'cho'; // 'cho' (플레이어) 또는 'han' (PC)
let selected = null;
let validMoves = [];
let gameOver = false;
let isAiThinking = false;
let lastMove = null;

function isHan(p) { return p && p === p.toUpperCase(); }
function isCho(p) { return p && p === p.toLowerCase(); }
function isSameTeam(p1, p2) {
  if (!p1 || !p2) return false;
  return (isHan(p1) && isHan(p2)) || (isCho(p1) && isCho(p2));
}

// 궁성 내부 확인
function inPalace(r, c, team) {
  if (c < 3 || c > 5) return false;
  if (team === 'han') return r >= 0 && r <= 2;
  return r >= 7 && r <= 9;
}

// 궁성 대각선 이동 가능 좌표 확인
function getPalaceDiagonals(r, c) {
  const diags = [];
  // 한나라 궁성 (0~2, 3~5)
  if ((r === 0 && c === 3) || (r === 0 && c === 5) || (r === 2 && c === 3) || (r === 2 && c === 5)) {
    diags.push([1, 4]);
  } else if (r === 1 && c === 4) {
    diags.push([0, 3], [0, 5], [2, 3], [2, 5]);
  }
  // 초나라 궁성 (7~9, 3~5)
  if ((r === 7 && c === 3) || (r === 7 && c === 5) || (r === 9 && c === 3) || (r === 9 && c === 5)) {
    diags.push([8, 4]);
  } else if (r === 8 && c === 4) {
    diags.push([7, 3], [7, 5], [9, 3], [9, 5]);
  }
  return diags;
}

// 게임 초기화 및 포진 배치
function initGame() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  
  // 한나라 (PC - 상단) 랜덤 고수 포진 선택
  const hanFormations = ['MSMS', 'SMSM', 'MSSM', 'SMMS'];
  const hanForm = hanFormations[Math.floor(Math.random() * hanFormations.length)];
  setupBackRow(0, 'han', hanForm);
  board[1][4] = 'K';
  board[2][1] = 'P'; board[2][7] = 'P';
  board[3][0] = 'S'; board[3][2] = 'S'; board[3][4] = 'S'; board[3][6] = 'S'; board[3][8] = 'S';

  // 초나라 (플레이어 - 하단) 사용자 선택 포진
  const choForm = document.getElementById('formationSelect').value;
  setupBackRow(9, 'cho', choForm);
  board[8][4] = 'k';
  board[7][1] = 'p'; board[7][7] = 'p';
  board[6][0] = 's'; board[6][2] = 's'; board[6][4] = 's'; board[6][6] = 's'; board[6][8] = 's';

  turn = 'cho';
  selected = null;
  validMoves = [];
  gameOver = false;
  isAiThinking = false;
  lastMove = null;

  document.getElementById('message-log').innerHTML = '';
  addLog(`[시스템] 새 대국 시작! (초: ${choForm} / 한: ${hanForm})`);
  addLog(`[안내] 초나라(플레이어) 선공입니다. 기물을 선택하세요.`);
  updateUI();
  drawBoard();
}

function setupBackRow(row, team, form) {
  const isH = team === 'han';
  const C = isH ? 'C' : 'c';
  const A = isH ? 'A' : 'a';
  const H = isH ? 'H' : 'h';
  const E = isH ? 'E' : 'e';

  board[row][0] = C; board[row][8] = C;
  board[row][3] = A; board[row][5] = A;

  const map = { 'M': H, 'S': E };
  board[row][1] = map[form[0]];
  board[row][2] = map[form[1]];
  board[row][6] = map[form[2]];
  board[row][7] = map[form[3]];
}

// 특정 기물의 이동 가능한 모든 수 생성 (자충수 제외 전)
function getPseudoMoves(b, r, c) {
  const p = b[r][c];
  if (!p) return [];
  const moves = [];
  const type = p.toUpperCase();
  const team = isHan(p) ? 'han' : 'cho';

  const addIfValid = (nr, nc) => {
    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return false;
    if (isSameTeam(p, b[nr][nc])) return false;
    moves.push({ fromR: r, fromC: c, toR: nr, toC: nc });
    return b[nr][nc] === null;
  };

  if (type === 'C') { // 차
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (let [dr, dc] of dirs) {
      let nr = r + dr, nc = c + dc;
      while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (!addIfValid(nr, nc)) break;
        nr += dr; nc += dc;
      }
    }
    // 궁성 대각선 직진
    for (let [dr, dc] of getPalaceDiagonals(r, c)) {
      if (!isSameTeam(p, b[dr][dc])) {
        moves.push({ fromR: r, fromC: c, toR: dr, toC: dc });
        if (b[dr][dc] === null && dr === 1 && dc === 4) {
          const oppR = 2 - r, oppC = 8 - c;
          if (!isSameTeam(p, b[oppR][oppC])) moves.push({ fromR: r, fromC: c, toR: oppR, toC: oppC });
        }
        if (b[dr][dc] === null && dr === 8 && dc === 4) {
          const oppR = 16 - r, oppC = 8 - c;
          if (!isSameTeam(p, b[oppR][oppC])) moves.push({ fromR: r, fromC: c, toR: oppR, toC: oppC });
        }
      }
    }
  } 
  else if (type === 'P') { // 포 (포는 포를 넘을 수 없고, 포를 취할 수 없음)
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (let [dr, dc] of dirs) {
      let nr = r + dr, nc = c + dc;
      let jumped = false;
      while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        const target = b[nr][nc];
        if (!jumped) {
          if (target !== null) {
            if (target.toUpperCase() === 'P') break; // 포는 못 넘음
            jumped = true;
          }
        } else {
          if (target === null) {
            moves.push({ fromR: r, fromC: c, toR: nr, toC: nc });
          } else {
            if (!isSameTeam(p, target) && target.toUpperCase() !== 'P') {
              moves.push({ fromR: r, fromC: c, toR: nr, toC: nc });
            }
            break;
          }
        }
        nr += dr; nc += dc;
      }
    }
    // 궁성 대각선 포 점프 (모서리 -> 중앙 기물 넘기 -> 반대편 모서리)
    if ((r === 0 || r === 2) && (c === 3 || c === 5) && b[1][4] && b[1][4].toUpperCase() !== 'P') {
      const oppR = 2 - r, oppC = 8 - c;
      const target = b[oppR][oppC];
      if (!isSameTeam(p, target) && (!target || target.toUpperCase() !== 'P')) {
        moves.push({ fromR: r, fromC: c, toR: oppR, toC: oppC });
      }
    }
    if ((r === 7 || r === 9) && (c === 3 || c === 5) && b[8][4] && b[8][4].toUpperCase() !== 'P') {
      const oppR = 16 - r, oppC = 8 - c;
      const target = b[oppR][oppC];
      if (!isSameTeam(p, target) && (!target || target.toUpperCase() !== 'P')) {
        moves.push({ fromR: r, fromC: c, toR: oppR, toC: oppC });
      }
    }
  }
  else if (type === 'H') { // 마
    const steps = [
      [-1,0,-2,-1], [-1,0,-2,1], [1,0,2,-1], [1,0,2,1],
      [0,-1,-1,-2], [0,-1,1,-2], [0,1,-1,2], [0,1,1,2]
    ];
    for (let [mr, mc, tr, tc] of steps) {
      if (r+mr >= 0 && r+mr < ROWS && c+mc >= 0 && c+mc < COLS && b[r+mr][c+mc] === null) {
        addIfValid(r+tr, c+tc);
      }
    }
  }
  else if (type === 'E') { // 상
    const steps = [
      [-1,0,-2,-1,-3,-2], [-1,0,-2,1,-3,2], [1,0,2,-1,3,-2], [1,0,2,1,3,2],
      [0,-1,-1,-2,-2,-3], [0,-1,1,-2,2,-3], [0,1,-1,2,-2,3], [0,1,1,2,2,3]
    ];
    for (let [m1r, m1c, m2r, m2c, tr, tc] of steps) {
      if (r+tr >= 0 && r+tr < ROWS && c+tc >= 0 && c+tc < COLS) {
        if (b[r+m1r][c+m1c] === null && b[r+m2r][c+m2c] === null) {
          addIfValid(r+tr, c+tc);
        }
      }
    }
  }
  else if (type === 'K' || type === 'A') { // 궁, 사
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (let [dr, dc] of dirs) {
      if (inPalace(r+dr, c+dc, team)) addIfValid(r+dr, c+dc);
    }
    for (let [dr, dc] of getPalaceDiagonals(r, c)) {
      if (inPalace(dr, dc, team)) addIfValid(dr, dc);
    }
  }
  else if (type === 'S') { // 졸, 병
    const forward = team === 'han' ? 1 : -1;
    addIfValid(r + forward, c);
    addIfValid(r, c - 1);
    addIfValid(r, c + 1);
    for (let [dr, dc] of getPalaceDiagonals(r, c)) {
      if ((team === 'han' && dr > r) || (team === 'cho' && dr < r)) {
        addIfValid(dr, dc);
      }
    }
  }
  return moves;
}

// 특정 진영의 궁이 장군 상태인지 확인
function isInCheck(b, team) {
  const kingChar = team === 'han' ? 'K' : 'k';
  let kr = -1, kc = -1;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (b[r][c] === kingChar) { kr = r; kc = c; break; }
    }
  }
  if (kr === -1) return true; // 궁이 잡힘

  // 상대방의 모든 기물이 궁 위치로 이동 가능한지 검사
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = b[r][c];
      if (!p) continue;
      if ((team === 'han' && isCho(p)) || (team === 'cho' && isHan(p))) {
        const enemyMoves = getPseudoMoves(b, r, c);
        for (let m of enemyMoves) {
          if (m.toR === kr && m.toC === kc) return true;
        }
      }
    }
  }
  return false;
}

// 자충수(장군을 부르거나 못 피하는 수)를 걸러낸 완벽한 합법 수 반환
function getLegalMoves(b, team) {
  const legal = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = b[r][c];
      if (!p) continue;
      if ((team === 'han' && isHan(p)) || (team === 'cho' && isCho(p))) {
        const pseudo = getPseudoMoves(b, r, c);
        for (let m of pseudo) {
          const captured = b[m.toR][m.toC];
          b[m.toR][m.toC] = p;
          b[m.fromR][m.fromC] = null;
          if (!isInCheck(b, team)) {
            legal.push(m);
          }
          b[m.fromR][m.fromC] = p;
          b[m.toR][m.toC] = captured;
        }
      }
    }
  }
  return legal;
}

// 보드 평가 함수 (한나라 PC 관점: 양수일수록 한나라 유리)
function evaluateBoard(b) {
  let score = 15; // 한나라 후공 덤(1.5점 = 15)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = b[r][c];
      if (!p) continue;
      let val = PIECE_VALUES[p];

      // 위치 가산점 (전략적 요충지 및 전진 보너스)
      const type = p.toUpperCase();
      if (type === 'S') {
        // 졸/병 전진 및 중앙 장악 보너스
        val += isHan(p) ? (r * 12) : -((9 - r) * 12);
        if (c >= 3 && c <= 5) val += isHan(p) ? 15 : -15;
      } else if (type === 'C') {
        // 차 중앙 줄/적진 침투 보너스
        if (c >= 2 && c <= 6) val += isHan(p) ? 20 : -20;
        if (isHan(p) && r >= 7) val += 35;
        if (isCho(p) && r <= 2) val -= 35;
      } else if (type === 'H' || type === 'E') {
        // 마/상 중앙 진출 보너스
        if (r >= 2 && r <= 7 && c >= 2 && c <= 6) {
          val += isHan(p) ? 18 : -18;
        }
      }
      score += val;
    }
  }
  return score;
}

// 알파-베타 가지치기 알고리즘 (깊이 4 탐색 + 기물 잡는 수 우선 정렬)
function alphaBeta(b, depth, alpha, beta, isMaximizing) {
  if (depth === 0) {
    return evaluateBoard(b);
  }

  const team = isMaximizing ? 'han' : 'cho';
  const moves = getLegalMoves(b, team);

  if (moves.length === 0) {
    // 외통수(체크메이트) 또는 빅장 판정
    if (isInCheck(b, team)) {
      return isMaximizing ? -90000 - depth * 100 : 90000 + depth * 100;
    }
    return 0;
  }

  // Move Ordering: 상대 기물을 잡는 수를 먼저 탐색하여 가지치기 효율 극대화
  moves.sort((a, bMove) => {
    const capA = b[a.toR][a.toC] ? Math.abs(PIECE_VALUES[b[a.toR][a.toC]]) : 0;
    const capB = b[bMove.toR][bMove.toC] ? Math.abs(PIECE_VALUES[b[bMove.toR][bMove.toC]]) : 0;
    return capB - capA;
  });

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (let m of moves) {
      const piece = b[m.fromR][m.fromC];
      const captured = b[m.toR][m.toC];
      b[m.toR][m.toC] = piece;
      b[m.fromR][m.fromC] = null;

      const evalScore = alphaBeta(b, depth - 1, alpha, beta, false);

      b[m.fromR][m.fromC] = piece;
      b[m.toR][m.toC] = captured;

      maxEval = Math.max(maxEval, evalScore);
      alpha = Math.max(alpha, evalScore);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (let m of moves) {
      const piece = b[m.fromR][m.fromC];
      const captured = b[m.toR][m.toC];
      b[m.toR][m.toC] = piece;
      b[m.fromR][m.fromC] = null;

      const evalScore = alphaBeta(b, depth - 1, alpha, beta, true);

      b[m.fromR][m.fromC] = piece;
      b[m.toR][m.toC] = captured;

      minEval = Math.min(minEval, evalScore);
      beta = Math.min(beta, evalScore);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

// PC(한나라) 즉시 응수 실행 함수
function triggerAiMove() {
  if (gameOver) return;
  isAiThinking = true;
  updateUI();

  // 브라우저 렌더링 직후 지연 없이 즉시 계산 수행
  requestAnimationFrame(() => {
    setTimeout(() => {
      const moves = getLegalMoves(board, 'han');
      if (moves.length === 0) {
        endGame('초나라(플레이어) 승리! 한나라가 둘 곳이 없습니다.');
        return;
      }

      // 탐색 깊이 3~4 (기물 수에 따라 동적 조절하여 속도 및 고수준 보장)
      let pieceCount = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) if (board[r][c]) pieceCount++;
      }
      const searchDepth = pieceCount <= 14 ? 4 : 3;

      moves.sort((a, bMove) => {
        const capA = board[a.toR][a.toC] ? Math.abs(PIECE_VALUES[board[a.toR][a.toC]]) : 0;
        const capB = board[bMove.toR][bMove.toC] ? Math.abs(PIECE_VALUES[board[bMove.toR][bMove.toC]]) : 0;
        return capB - capA;
      });

      let bestMove = moves[0];
      let bestScore = -Infinity;

      for (let m of moves) {
        const piece = board[m.fromR][m.fromC];
        const captured = board[m.toR][m.toC];
        board[m.toR][m.toC] = piece;
        board[m.fromR][m.fromC] = null;

        const score = alphaBeta(board, searchDepth - 1, -Infinity, Infinity, false);

        board[m.fromR][m.fromC] = piece;
        board[m.toR][m.toC] = captured;

        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }

      executeMove(bestMove, 'han');
      isAiThinking = false;
    }, 30);
  });
}

// 실제 기물 이동 및 상태 업데이트
function executeMove(move, team) {
  const piece = board[move.fromR][move.fromC];
  const captured = board[move.toR][move.toC];

  board[move.toR][move.toC] = piece;
  board[move.fromR][move.fromC] = null;
  lastMove = move;
  selected = null;
  validMoves = [];

  const teamName = team === 'cho' ? '초(나)' : '한(PC)';
  const pName = PIECE_NAMES[piece];
  let logText = `[${teamName}] ${pName} (${move.fromR+1},${move.fromC+1}) → (${move.toR+1},${move.toC+1})`;
  if (captured) {
    logText += ` [${PIECE_NAMES[captured]} 취함!]`;
  }
  addLog(logText);

  // 다음 턴 전환
  turn = team === 'cho' ? 'han' : 'cho';
  drawBoard();
  updateUI();

  // 상대방 외통수 및 장군 체크
  const nextMoves = getLegalMoves(board, turn);
  const inCheck = isInCheck(board, turn);

  if (nextMoves.length === 0) {
    if (inCheck) {
      endGame(team === 'cho' ? '외통수! 초나라(플레이어) 승리!' : '외통수! 한나라(PC) 승리!');
    } else {
      endGame('더 이상 둘 곳이 없어 무승부입니다.');
    }
    return;
  }

  if (inCheck) {
    document.getElementById('alertDisplay').innerText = '⚡ 장군! (멍군 필요)';
    addLog(`[경고] ${turn === 'cho' ? '초나라' : '한나라'} 장군입니다!`);
  } else {
    document.getElementById('alertDisplay').innerText = '';
  }

  // 플레이어(초)가 둔 직후 PC(한)가 바로 공격 실행
  if (turn === 'han' && !gameOver) {
    triggerAiMove();
  }
}

// 한수 쉼 버튼 기능
function passTurn() {
  if (gameOver || turn !== 'cho' || isAiThinking) return;
  if (isInCheck(board, 'cho')) {
    alert('장군 상태에서는 한수 쉴 수 없습니다!');
    return;
  }
  selected = null;
  validMoves = [];
  addLog('[초(나)] 한수 쉼을 선택했습니다.');
  turn = 'han';
  drawBoard();
  updateUI();
  triggerAiMove();
}

function endGame(msg) {
  gameOver = true;
  isAiThinking = false;
  document.getElementById('alertDisplay').innerText = msg;
  addLog(`[종료] ${msg}`);
  updateUI();
  setTimeout(() => alert(msg), 100);
}

// 캔버스 클릭 이벤트 (초나라 조작)
canvas.addEventListener('click', (e) => {
  if (gameOver || turn !== 'cho' || isAiThinking) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const c = Math.round((x - OFFSET_X) / CELL);
  const r = Math.round((y - OFFSET_Y) / CELL);

  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

  // 이미 선택된 기물의 이동 가능 위치를 클릭한 경우 -> 즉시 이동 및 PC 응수
  const targetMove = validMoves.find(m => m.toR === r && m.toC === c);
  if (targetMove) {
    executeMove(targetMove, 'cho');
    return;
  }

  // 초나라 기물 선택
  const clickedPiece = board[r][c];
  if (clickedPiece && isCho(clickedPiece)) {
    selected = { r, c };
    const allLegal = getLegalMoves(board, 'cho');
    validMoves = allLegal.filter(m => m.fromR === r && m.fromC === c);
    drawBoard();
  } else {
    selected = null;
    validMoves = [];
    drawBoard();
  }
});

// 장기판 및 기물 그리기
function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 격자 선 그리기
  ctx.strokeStyle = '#3b2816';
  ctx.lineWidth = 2;

  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(OFFSET_X, OFFSET_Y + r * CELL);
    ctx.lineTo(OFFSET_X + (COLS - 1) * CELL, OFFSET_Y + r * CELL);
    ctx.stroke();
  }
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(OFFSET_X + c * CELL, OFFSET_Y);
    ctx.lineTo(OFFSET_X + c * CELL, OFFSET_Y + (ROWS - 1) * CELL);
    ctx.stroke();
  }

  // 궁성 대각선 그리기
  const drawDiag = (r1, c1, r2, c2) => {
    ctx.beginPath();
    ctx.moveTo(OFFSET_X + c1 * CELL, OFFSET_Y + r1 * CELL);
    ctx.lineTo(OFFSET_X + c2 * CELL, OFFSET_Y + r2 * CELL);
    ctx.stroke();
  };
  drawDiag(0, 3, 2, 5); drawDiag(0, 5, 2, 3);
  drawDiag(7, 3, 9, 5); drawDiag(7, 5, 9, 3);

  // 직전 이동 경로 하이라이트
  if (lastMove) {
    ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
    ctx.fillRect(OFFSET_X + lastMove.fromC * CELL - 30, OFFSET_Y + lastMove.fromR * CELL - 30, 60, 60);
    ctx.fillStyle = 'rgba(255, 140, 0, 0.35)';
    ctx.fillRect(OFFSET_X + lastMove.toC * CELL - 30, OFFSET_Y + lastMove.toR * CELL - 30, 60, 60);
  }

  // 이동 가능 위치 표시
  for (let m of validMoves) {
    const vx = OFFSET_X + m.toC * CELL;
    const vy = OFFSET_Y + m.toR * CELL;
    ctx.beginPath();
    ctx.arc(vx, vy, board[m.toR][m.toC] ? 32 : 12, 0, Math.PI * 2);
    ctx.fillStyle = board[m.toR][m.toC] ? 'rgba(220, 40, 40, 0.45)' : 'rgba(30, 160, 70, 0.65)';
    ctx.fill();
  }

  // 기물 그리기 (팔각형 장기알)
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (!p) continue;
      drawPiece(r, c, p);
    }
  }
}

function drawPiece(r, c, p) {
  const x = OFFSET_X + c * CELL;
  const y = OFFSET_Y + r * CELL;
  const type = p.toUpperCase();
  const radius = type === 'K' ? 33 : (['C','P','H','E'].includes(type) ? 28 : 23);

  // 선택된 기물 테두리 강조
  if (selected && selected.r === r && selected.c === c) {
    ctx.beginPath();
    ctx.arc(x, y, radius + 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(50, 220, 100, 0.6)';
    ctx.fill();
  }

  // 팔각형 외곽선
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI / 4) * i + Math.PI / 8;
    const px = x + radius * Math.cos(angle);
    const py = y + radius * Math.sin(angle);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();

  ctx.fillStyle = '#fdf5e6';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = isHan(p) ? '#b82525' : '#186a3b';
  ctx.stroke();

  // 한자 텍스트
  ctx.fillStyle = isHan(p) ? '#b82525' : '#186a3b';
  ctx.font = `bold ${radius * 1.15}px "Batang", "Malgun Gothic", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(PIECE_NAMES[p], x, y + 2);
}

// UI 및 점수판 업데이트
function updateUI() {
  const turnDiv = document.getElementById('turnDisplay');
  const passBtn = document.getElementById('passBtn');

  if (gameOver) {
    turnDiv.innerText = '대국 종료';
    turnDiv.className = 'turn-indicator';
    passBtn.disabled = true;
  } else if (turn === 'cho') {
    turnDiv.innerText = '초나라(플레이어) 차례';
    turnDiv.className = 'turn-indicator turn-cho';
    passBtn.disabled = false;
  } else {
    turnDiv.innerText = '한나라(PC) 응수 중...';
    turnDiv.className = 'turn-indicator turn-han';
    passBtn.disabled = true;
  }

  // 기물 점수 계산
  const scoreMap = { 'C': 13, 'P': 7, 'H': 5, 'E': 3, 'A': 3, 'S': 2 };
  let choPts = 0, hanPts = 1.5; // 한나라 후공 덤 1.5점
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = board[r][c];
      if (!p || p.toUpperCase() === 'K') continue;
      if (isCho(p)) choPts += scoreMap[p.toUpperCase()];
      else hanPts += scoreMap[p.toUpperCase()];
    }
  }
  document.getElementById('choScore').innerText = choPts;
  document.getElementById('hanScore').innerText = hanPts;
}

function addLog(msg) {
  const logBox = document.getElementById('message-log');
  const div = document.createElement('div');
  div.innerText = msg;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
}

// 초기 실행
initGame();
</script>
