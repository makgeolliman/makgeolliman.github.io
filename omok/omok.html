
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>15x15 AI 오목 게임</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: 'Malgun Gothic', sans-serif;
        }
        h1 { margin-bottom: 10px; color: #333; }
        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #d35400;
        }
        canvas {
            background-color: #dcb35c;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            cursor: pointer;
            border-radius: 4px;
        }
        .controls {
          margin-top: 15px;
        }
        button {
            margin-top: 20px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #34495e; }
    </style>
</head>
<body>

    <div id="status">당신의 차례입니다. (흑돌)</div>
    <canvas id="board" width="600" height="600"></canvas>
    <div class="controls">
      <button onclick="resetGame()">새 게임 시작</button>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        const SIZE = 15; // 15x15 바둑판
        const CELL = 40; // 한 칸의 크기
        const PADDING = 20; // 테두리 여백

        let boardState = [];
        let isPlayerTurn = true;
        let gameOver = false;
        let lastMove = null;

        const CELL_SIZE = (canvas.width - CELL * 2) / (SIZE - 1);   // 한 칸의 간격

        boardState = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        isPlayerTurn = 1;

        // 게임 초기화
        function init() {
            gameOver = false;
            lastMove = null;
            statusDiv.innerText = "당신의 차례입니다. (흑돌)";
            drawBoard();
        }

        // 바둑판 및 돌 그리기
        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 격자 선 그리기
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;

            for (let i = 0; i < SIZE; i++) {
              const pos = CELL + i * CELL_SIZE;

              // 가로선
              ctx.beginPath();
              ctx.moveTo(CELL, pos);
              ctx.lineTo(canvas.width - CELL, pos);
              ctx.stroke();

              // 세로선
              ctx.beginPath();
              ctx.moveTo(pos, CELL);
              ctx.lineTo(pos, canvas.height - CELL);
              ctx.stroke();
            }

            // 2. 화점(점) 그리기 (15x15 기준: (3,3), (3,11), (7,7), (11,3), (11,11))
            const starPoints = [, [3, 11],, , [11, 11]      ];

            ctx.fillStyle = '#000000';
            starPoints.forEach(([row, col]) => {
              ctx.beginPath();
              ctx.arc(
                CELL + col * CELL_SIZE,
                CELL + row * CELL_SIZE,
                4, 0, Math.PI * 2
              );
              ctx.fill();
            });

            // 바둑돌 그리기
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (boardState[r][c] !== 0) {
                      drawStone();
                    }
                }
            }

            // 마지막에 둔 돌 표시 (빨간 점)
            if (lastMove) {
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(PADDING + lastMove.c * CELL, PADDING + lastMove.r * CELL, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }


        // 바둑돌 그리기
        function drawStone() {
          for (let row = 0; row < SIZE; row++) {
            for (let col = 0; col < SIZE; col++) {
              if (boardState[row][col] === 0) continue;

              const x = CELL + col * CELL_SIZE;
              const y = CELL + row * CELL_SIZE;
              const radius = CELL_SIZE * 0.43;

              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);

              // 입체감을 위한 그라데이션 효과
              const gradient = ctx.createRadialGradient(
                x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);

              if (boardState[row][col] === 1) {
                gradient.addColorStop(0, '#555555');
                gradient.addColorStop(1, '#000000');
              } else {
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#cccccc');
              }

              ctx.fillStyle = gradient;
              ctx.fill();
            }
          }
        }

        // 마우스 클릭 이벤트 (플레이어 착수)
        canvas.addEventListener('click', (e) => {
            if (gameOver || !isPlayerTurn) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.round((x - PADDING) / CELL);
            const r = Math.round((y - PADDING) / CELL);

            if (r >= 0 && r < SIZE && c >= 0 && c < SIZE && boardState[r][c] === 0) {
                placeStone(r, c, 1);
                if (!gameOver) {
                    isPlayerTurn = false;
                    statusDiv.innerText = "PC가 생각 중입니다...";
                    setTimeout(aiMove, 200); // PC가 자연스럽게 두도록 약간의 지연
                }
            }
        });

        // 돌 놓기 및 승리 판정
        function placeStone(r, c, player) {
            boardState[r][c] = player;
            lastMove = { r, c };
            drawBoard();

            if (checkWin(r, c, player)) {
                gameOver = true;
                statusDiv.innerText = player === 1 ? "축하합니다! 당신이 승리했습니다!" : "PC가 승리했습니다!";
                return;
            }
        }

        // 5목 달성 여부 확인
        function checkWin(r, c, player) {
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];
            for (let [dr, dc] of dirs) {
                let count = 1;
                for (let d = 1; d < 5; d++) {
                    let nr = r + dr * d, nc = c + dc * d;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && boardState[nr][nc] === player) count++;
                    else break;
                }
                for (let d = 1; d < 5; d++) {
                    let nr = r - dr * d, nc = c - dc * d;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && boardState[nr][nc] === player) count++;
                    else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        // PC 인공지능 착수 (공격 및 방어 가중치 평가 알고리즘)
        function aiMove() {
            let bestScore = -1;
            let bestMoves = [];

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (boardState[r][c] === 0) {
                        // AI의 공격 점수와 플레이어 방어 점수를 합산하여 최적의 자리 탐색
                        let attackScore = evaluatePosition(r, c, 2);
                        let defenseScore = evaluatePosition(r, c, 1);
                        let totalScore = attackScore * 1.1 + defenseScore; // 공격에 약간 더 가중치

                        if (totalScore > bestScore) {
                            bestScore = totalScore;
                            bestMoves = [{ r, c }];
                        } else if (totalScore === bestScore) {
                            bestMoves.push({ r, c });
                        }
                    }
                }
            }

            // 최고 점수가 같은 자리가 여러 곳이면 그중 무작위 선택
            const move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            placeStone(move.r, move.c, 2);

            if (!gameOver) {
                isPlayerTurn = true;
                statusDiv.innerText = "당신의 차례입니다. (흑돌)";
            }
        }

        // 특정 위치의 가치 계산
        function evaluatePosition(r, c, player) {
            let score = 0;
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];

            // 중앙에 가까울수록 기본 점수 부여
            const centerDist = Math.abs(7 - r) + Math.abs(7 - c);
            score += (14 - centerDist);

            for (let [dr, dc] of dirs) {
                let count = 1;
                let openEnds = 0;

                // 정방향 탐색
                let d = 1;
                while (true) {
                    let nr = r + dr * d, nc = c + dc * d;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && boardState[nr][nc] === player) {
                        count++; d++;
                    } else {
                        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && boardState[nr][nc] === 0) openEnds++;
                        break;
                    }
                }

                // 역방향 탐색
                d = 1;
                while (true) {
                    let nr = r - dr * d, nc = c - dc * d;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && boardState[nr][nc] === player) {
                        count++; d++;
                    } else {
                        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && boardState[nr][nc] === 0) openEnds++;
                        break;
                    }
                }

                // 연속된 돌의 개수와 열린 방향에 따른 점수 부여
                if (count >= 5) score += 100000;
                else if (count === 4) {
                    if (openEnds === 2) score += 10000;
                    else if (openEnds === 1) score += 1000;
                } else if (count === 3) {
                    if (openEnds === 2) score += 1000;
                    else if (openEnds === 1) score += 100;
                } else if (count === 2) {
                    if (openEnds === 2) score += 100;
                    else if (openEnds === 1) score += 10;
                }
            }
            return score;
        }

        function resetGame() {
            boardState = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
            isPlayerTurn = 1;
            init();
        }

        // 시작 시 실행
        init();
    </script>
</body>
</html>
